name: GitHub Daily Hot to Feishu

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the Feishu card in logs without sending"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: github-daily-hot-feishu
  cancel-in-progress: false

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check whether today's digest was already sent
        id: dedupe
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Shanghai date +%F)"
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/crawler.yml/runs?event=schedule&status=success&per_page=30"
          if ! response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url")"; then
            echo "GitHub run lookup failed; continuing so today's digest is not missed."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prior_count="$(jq --arg today "$today" --argjson current "$CURRENT_RUN_ID" '
            def shanghai_date:
              fromdateiso8601 | . + 28800 | strftime("%Y-%m-%d");
            [.workflow_runs[]
              | select(.id != $current)
              | select((.created_at | shanghai_date) == $today)]
            | length
          ' <<< "$response")"
          if (( prior_count > 0 )); then
            echo "A successful scheduled digest already exists for $today; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful scheduled digest exists for $today; continuing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record duplicate suppression
        if: steps.dedupe.outputs.skip == 'true'
        run: echo "Today's GitHub digest was already sent successfully."

      - name: Check out repository
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait until 09:17 Asia/Shanghai
        if: github.event_name == 'schedule' && steps.dedupe.outputs.skip != 'true'
        shell: bash
        run: |
          target="$(TZ=Asia/Shanghai date -d "$(TZ=Asia/Shanghai date +%F) 09:17:00" +%s)"
          now="$(date +%s)"
          if (( now < target )); then
            delay=$((target - now))
            echo "Scheduler arrived early; waiting ${delay}s until 09:17 Asia/Shanghai."
            sleep "$delay"
          else
            echo "Scheduler arrived after 09:17; sending immediately."
          fi

      - name: Build and send report
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SIGNING_SECRET: ${{ secrets.FEISHU_SIGNING_SECRET }}
          REPORT_LIMIT: "10"
          # Retired activation probes stay dry-run guards in case GitHub delivers queued events late.
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (github.event.schedule == '45 10 3 9 *' || github.event.schedule == '30 11 3 9 *') && '1' || '0' }}
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "1" ]]; then
            python github_daily_hot.py --dry-run --limit "$REPORT_LIMIT"
          else
            python github_daily_hot.py --limit "$REPORT_LIMIT"
          fi

