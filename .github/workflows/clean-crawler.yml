name: Enable GitHub Daily Scheduler

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/clean-crawler.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  enable-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Enable the proven scheduler workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/crawler.yml/enable"
          echo "Enabled crawler.yml for scheduled GitHub daily alerts."

  send-today-catch-up:
    if: github.event_name == 'push'
    uses: ./.github/workflows/github-daily-hot-v2.yml
    secrets: inherit
