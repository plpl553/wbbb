name: Enable GitHub Daily Scheduler

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/clean-crawler.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  enable-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Enable the proven scheduler workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable crawler.yml
          echo "Enabled crawler.yml for scheduled GitHub daily alerts."
