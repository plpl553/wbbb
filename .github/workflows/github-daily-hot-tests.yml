name: Test GitHub Daily Hot

on:
  pull_request:
    paths:
      - "github_daily_hot.py"
      - "tests/test_github_daily_hot.py"
      - ".github/workflows/github-daily-hot.yml"
      - ".github/workflows/github-daily-hot-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

